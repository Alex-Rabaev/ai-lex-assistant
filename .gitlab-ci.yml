deploy:
  stage: deploy
  image: dtzar/helm-kubectl:latest
  script:
    - cat $KUBECONFIG_BASE64 | base64 -d > $KUBECONFIG_PATH
    - export KUBECONFIG=$KUBECONFIG_PATH
    - kubectl rollout restart deployment gateway-deployment
    - kubectl rollout restart deployment conversations-worker-deployment
    - kubectl rollout restart deployment outbound-worker-deployment
    - kubectl rollout restart deployment websocket-deployment
    - kubectl rollout restart deployment temporal-worker-deployment
  only:
    - master

deploy-prod:
  stage: deploy
  image: dtzar/helm-kubectl:latest
  variables:
    KUBECONFIG_PATH: "/tmp/prod_kubeconfig"
  script:
    - cat $KUBECONFIG_PROD_BASE64 | base64 -d > $KUBECONFIG_PATH
    - export KUBECONFIG=$KUBECONFIG_PATH
    - kubectl config set-context --current --namespace=ai-lex-prod
    - kubectl rollout restart deployment gateway-deployment
    - kubectl rollout restart deployment conversations-worker-deployment
    - kubectl rollout restart deployment outbound-worker-deployment
    - kubectl rollout restart deployment websocket-deployment
    - kubectl rollout restart deployment temporal-worker-deployment
  only:
    - prod

base_build:
  stage: base_build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx create --use
    - docker buildx inspect --bootstrap
    - docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.base -t $CONTAINER_BASE_IMAGE --push .
  only:
    - base_build
